<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Josi</title>
<link rel="stylesheet" href="/__josi/loader.css">
<script type="module" src="/__josi/loader.js"></script>
</head>
<body>
<main>
  <h1>Josi</h1>
  <p id="status">Starting…</p>
  <form id="pair" hidden>
    <label for="code">Pairing code</label>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
    <button type="submit">Pair this browser</button>
    <p class="note">Make a code on your Josi server, under Hey Josi › Devices. This only connects this browser to your server. You still sign in to Josi after it.</p>
  </form>
  <p class="note"><a href="/__josi/privacy.html">What the relay can and can't see</a></p>
</main>
</body>
</html>
