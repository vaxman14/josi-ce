services:
  hosted:
    image: heyjosi-hosted:latest
    restart: unless-stopped
    env_file: [settings.env, generated.env, secrets.env]
    expose: ["8080"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
