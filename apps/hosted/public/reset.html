<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose a new password - Hey Josi</title>
<link rel="stylesheet" href="/style.css?v=3">
<script type="module" src="/app.js?v=3"></script>
</head>
<body class="gate">
<aside class="gate-art" aria-hidden="true">
<div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
<div class="gate-brand"><img src="/josi-mark.png" alt="" width="44" height="44"><span>Hey Josi</span></div>
<div class="gate-pitch">
<h2>Your assistant.<br>Your server.<br>Your rules.</h2>
<p>One private address for the Josi you run yourself, encrypted from your devices all the way home.</p>
</div>
<p class="gate-foot">The relay carries sealed traffic. It can't read a word.</p>
</aside>
<main class="gate-panel">
<div class="gate-card">
<a class="gate-mobile-brand" href="/"><img src="/josi-mark.png" alt="" width="36" height="36"><span>Hey Josi</span></a>
<h1>Choose a new password</h1>
<form data-form="reset">
<label>New password, at least 12 characters <input name="password" type="password" autocomplete="new-password" minlength="12" required></label>
<button>Save it</button>
<p class="error" role="alert"></p>
</form>
</div>
</main>
</body>
</html>
