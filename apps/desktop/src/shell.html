<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Josi</title><link rel="stylesheet" href="shell.css"></head>
<body><main><div class="mark" aria-hidden="true">j.</div><p class="eyebrow">YOUR JOSI, CONNECTED</p>
