name: publish Gate image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Gate deployment branch or commit to build.'
        required: true
      tag:
        description: 'Image tag to publish.'
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.source_ref }}' == deploy/gate-* ]] || {
            echo 'source_ref must name a deploy/gate-* branch' >&2
            exit 1
          }
          [[ '${{ inputs.tag }}' =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]] || {
            echo 'tag contains unsupported characters' >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - id: source
        name: Record exact source commit
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Run source-controlled code before registry credentials enter the job.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: bash scripts/scan-secrets.sh

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      # Pin publication to the commit that passed validation even if the branch
      # moves while this workflow is running.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Gate image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            JOSI_VERSION=${{ inputs.tag }}
            JOSI_BUILD_ID=${{ needs.validate.outputs.source_sha }}
          tags: |
            romanvaxman/josi-ce-gate:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/vaxman14/josi-ce
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          provenance: true
          sbom: true

      - name: Report published images
        shell: bash
        run: |
          docker buildx imagetools inspect "romanvaxman/josi-ce-gate:${{ inputs.tag }}"
