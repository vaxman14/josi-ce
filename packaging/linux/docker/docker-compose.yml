# Josi's Linux server as one container. See README.md beside this file.
#
#   JOSI_HOST_ADDRESS=<this machine's address> docker compose up -d
#   docker compose logs josi | grep "Open this" | tail -1     # the one-time setup link
#
# JOSI_IMAGE picks the image (default josi:latest); JOSI_PORT the published port.
services:
  josi:
    image: ${JOSI_IMAGE:-josi:latest}
    container_name: josi
    restart: unless-stopped
    # systemd runs the same six services as a real install, with their
    # sandboxing, so it needs these two.
    privileged: true
    cgroup: host
    tty: true
    stop_signal: SIGRTMIN+3
    ports:
      - "${JOSI_PORT:-8080}:8080"
    # A model server on this same machine (Ollama and the like) is reached from
    # inside the container as http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JOSI_HOST_ADDRESS: ${JOSI_HOST_ADDRESS:?set JOSI_HOST_ADDRESS to the address people use to reach this machine}
      JOSI_HOST_PORT: ${JOSI_PORT:-8080}
      # Set when Josi is published at an https name through a tunnel or proxy.
      JOSI_PUBLIC_URL: ${JOSI_PUBLIC_URL:-}
      JOSI_PC_CONTROL: ${JOSI_PC_CONTROL:-1}
      JOSI_BROWSER: ${JOSI_BROWSER:-1}
    volumes:
      - josi-data:/var/lib/josi
      - josi-pc:/var/lib/josi-pc
      - josi-etc:/etc/josi
      - josi-home:/home/josi

volumes:
  josi-data:
  josi-pc:
  josi-etc:
  josi-home:
