# Bring your own reverse proxy.
#
# The bundled Caddy handles automatic HTTPS for most installations. Operators
# who already terminate TLS — an existing nginx, Traefik, a corporate load
# balancer — layer this file on top to publish the app directly and skip Caddy:
#
#   docker compose -f docker-compose.yml -f docker-compose.noproxy.yml \
#     up -d --scale caddy=0
#
# Then point your proxy at http://<host>:${JOSI_WEB_PORT:-8080}.
#
# Your proxy MUST terminate TLS. Josi sets secure, httpOnly session cookies;
# served over plain http they are dropped by the browser and sign-in silently
# fails. Set JOSI_COOKIE_SECURE=false only for local development.
#
# Forward X-Forwarded-For and X-Forwarded-Proto, and set JOSI_TRUSTED_PROXIES in
# .env to your proxy's address as Josi sees it (commas between entries, CIDR
# ranges allowed):
#
#   JOSI_TRUSTED_PROXIES=10.0.0.5
#
# Josi believes X-Forwarded-For from those addresses only, because this file
# publishes the port and anyone who reaches it could otherwise pick a new address
# per request and walk past the sign-in limits. Until it is set, every visitor
# counts as your proxy: the audit log shows its address, and 25 failed sign-ins by
# anyone hold back sign-in for everybody for 15 minutes. A proxy on the same host
# as Docker usually appears as the Docker network's gateway. List only addresses
# nobody else can connect from, and keep this port closed to everything but the
# proxy.

services:
  web:
    environment:
      JOSI_TRUSTED_PROXIES: ${JOSI_TRUSTED_PROXIES:-}
    ports:
      - "${JOSI_WEB_PORT:-8080}:8080"
